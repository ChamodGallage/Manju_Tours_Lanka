services:
  postgres:
    image: postgres:16-alpine
    container_name: manju_tours_db
    restart: always
    environment:
      POSTGRES_USER: manju_user
      POSTGRES_PASSWORD: manju_secure_pass
      POSTGRES_DB: manju_tours_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
